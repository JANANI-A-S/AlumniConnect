# ==============================================================================
# Centralized Alumni Tracking & Institutional Engagement Portal Configuration
# ==============================================================================

spring.application.name=alumni-portal
server.port=8081

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# Schema: alumni_portal_db (automatically created if not present)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_portal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=janani
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Data Seeding
# Defer datasource initialization so JPA creates the tables before data.sql runs
# ------------------------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ------------------------------------------------------------------------------
# Thymeleaf View Engine Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.alumni.portal=INFO
logging.level.org.springframework.security=INFO
